# Checks for incoming pull requests, including from forks.
#
# Uses `pull_request`, NOT `pull_request_target`: fork code runs with no
# repository secrets and a read-only token. Never change this trigger.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile main and test sources
        run: ./gradlew compileJava compileTestJava --no-daemon

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Block credential files and build output
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$HEAD")
          echo "Changed files:"; echo "$FILES" | sed 's/^/  /'

          BAD=$(echo "$FILES" | grep -iE '\.(pem|key|p12|pfx|jks|keystore)$|(^|/)\.env|credentials\.json$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Credential files must never be committed:"; echo "$BAD" | sed 's/^/  /'; exit 1
          fi

          OUT=$(echo "$FILES" | grep -E '^(build|out)/|\.class$|\.jar$' || true)
          if [ -n "$OUT" ]; then
            echo "::error::Build output must not be committed:"; echo "$OUT" | sed 's/^/  /'; exit 1
          fi
          echo "No credential or build-output paths."

      - name: Block oversized files
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FAIL=0
          for f in $(git diff --name-only --diff-filter=AM "$BASE" "$HEAD"); do
            [ -f "$f" ] || continue
            sz=$(wc -c < "$f")
            if [ "$sz" -gt 2097152 ]; then
              echo "::error file=$f::$((sz/1048576))MB exceeds the 2MB limit."; FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "No oversized files." || exit 1

  tests:
    name: Tests (reporting only)
    runs-on: ubuntu-latest
    # Non-blocking: 8 of 66 tests fail on main already, unrelated to any
    # incoming change. Blocking on them would reject every contribution.
    # Once those are fixed this becomes a required check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run JUnit suite
        run: ./gradlew test --no-daemon || true
      - name: Summarise results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, os
          tot=fail=0; rows=[]
          for f in glob.glob("build/test-results/test/*.xml"):
              t=ET.parse(f).getroot(); tot+=int(t.get("tests",0))
              for tc in t.iter("testcase"):
                  for bad in list(tc.iter("failure"))+list(tc.iter("error")):
                      fail+=1
                      rows.append(f"| `{tc.get('classname','').split('.')[-1]}.{tc.get('name')}` | {(bad.get('message') or '')[:70]} |")
          out=[f"## JUnit results", "", f"**{tot-fail} passed, {fail} failed, {tot} total**", ""]
          if rows:
              out += ["| Test | Message |", "|---|---|"] + sorted(rows)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(out) + "\n")
          print(f"{tot-fail}/{tot} passed")
          PY
